[package]
name = "flightplan"
version = "0.1.0"
edition = "2024"
description = "Flight planner for the US: sectional-style chart, routes, navlog, weather, weight & balance and briefing"
license = "MIT"
default-run = "flightplan"

[lib]
name = "flightplan"
path = "src/lib.rs"

[[bin]]
name = "flightplan"
path = "src/main.rs"

# headless screenshots of the real UI (development aid): cargo run --features shots --bin shots
[[bin]]
name = "shots"
path = "src/bin/shots.rs"
required-features = ["shots"]

[features]
shots = ["dep:egui_kittest"]

[dependencies]
flightplan-server = { path = "../server" }
anyhow = "1"
chrono = "0.4"
directories = "6"
earcutr = "0.5"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.36"
egui-phosphor = "0.14"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
open = "5"
parking_lot = "0.13"
printpdf = { version = "0.12", default-features = false }
regex = "1"
roxmltree = "0.20"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "http2", "system-proxy"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
ttf-parser = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
world_magnetic_model = "1.2025"

egui_kittest = { version = "0.36", features = ["wgpu", "eframe"], optional = true }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
