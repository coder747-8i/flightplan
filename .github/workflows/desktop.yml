# Native desktop app (Rust + egui) for Linux, macOS and Windows.
# Every run uploads the packages as workflow artifacts; pushing a tag like v0.2.0 also
# attaches them to a draft GitHub release. The builds aren't code-signed: Windows SmartScreen
# and macOS Gatekeeper warn on first open (macOS: right-click the app → Open).
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev

      - name: Test
        working-directory: native
        run: cargo test --locked --lib

      - name: Build (Linux / Windows)
        if: runner.os != 'macOS'
        working-directory: native
        run: cargo build --release --locked

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        working-directory: native
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/flightplan \
            target/aarch64-apple-darwin/release/flightplan target/x86_64-apple-darwin/release/flightplan

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="$(grep -m1 '^version' native/Cargo.toml | cut -d'"' -f2)-${GITHUB_SHA::7}"
          out="Flightplan-$version-${{ matrix.name }}"
          mkdir -p dist
          case "$RUNNER_OS" in
            Linux)
              mkdir -p "$out"
              cp native/target/release/flightplan "$out/"
              cp native/assets/icons/128x128@2x.png "$out/flightplan.png"
              cat > "$out/flightplan.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Flightplan
          Comment=Flight planner: chart, route, weather, go / no-go
          Exec=flightplan
          Icon=flightplan
          Categories=Utility;Education;
          StartupWMClass=io.github.coder747_8i.flightplan
          EOF
              cp LICENSE README.md "$out/"
              tar -czf "dist/$out.tar.gz" "$out"
              ;;
            Windows)
              mkdir -p "$out"
              cp native/target/release/flightplan.exe "$out/Flightplan.exe"
              cp LICENSE README.md "$out/"
              7z a "dist/$out.zip" "$out" > /dev/null
              ;;
            macOS)
              app="$out/Flightplan.app/Contents"
              mkdir -p "$app/MacOS" "$app/Resources"
              cp native/target/release/flightplan "$app/MacOS/Flightplan"
              cp native/assets/icons/icon.icns "$app/Resources/Flightplan.icns"
              cat > "$app/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Flightplan</string>
            <key>CFBundleDisplayName</key><string>Flightplan</string>
            <key>CFBundleIdentifier</key><string>io.github.coder747-8i.Flightplan</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleShortVersionString</key><string>${version%%-*}</string>
            <key>CFBundleExecutable</key><string>Flightplan</string>
            <key>CFBundleIconFile</key><string>Flightplan</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
              cp LICENSE README.md "$out/"
              hdiutil create -volname Flightplan -srcfolder "$out" -ov -format UDZO "dist/$out.dmg"
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Flightplan-${{ matrix.name }}
          path: dist/*

      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
