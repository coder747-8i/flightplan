# Desktop installers for Windows, macOS and Linux.
# Every run uploads the installers as workflow artifacts; pushing a tag like v0.2.0 also
# attaches them to a draft GitHub release.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            args: ''
          - os: windows-latest
            name: windows
            args: ''
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # optional repository variable: where the setup screen downloads chart data from
      FP_DATA_URL: ${{ vars.FP_DATA_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build
        working-directory: desktop
        run: |
          npm ci
          npx tauri build ${{ matrix.args }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find desktop/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \) \
            -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: flightplan-${{ matrix.name }}
          path: out/*

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*
