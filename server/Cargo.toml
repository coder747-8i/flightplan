[package]
name = "flightplan-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
dotenvy = "0.15.7"
futures = "0.3.34"
parking_lot = "0.13.0"
png = "0.18.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "http2", "query", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "cors", "compression-gzip", "compression-br", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
